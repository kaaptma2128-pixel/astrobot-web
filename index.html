
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>Astrabot — AI Assistant</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#17171d;--panel2:#202027;--line:#2c2c35;--text:#f4f4f6;--muted:#a1a1ad;--accent:#a78bfa;--danger:#fca5a5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100dvh}
button,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1500px;margin:auto}
aside{background:#131318;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:7px 8px 15px;font-size:19px;font-weight:750}
.logo{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#c4b5fd,#7c3aed);color:#171323;font-size:19px}
.new-chat{width:100%;border:1px solid #3b354c;background:#211b2e;color:#f4efff;border-radius:12px;padding:11px 12px;text-align:left;display:flex;gap:10px;align-items:center}
.new-chat:hover{background:#2a2140}
.history-title{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:8px 10px 0}
#history{overflow:auto;display:flex;flex-direction:column;gap:4px}
.history-item{border:0;background:transparent;color:#c7c7d0;text-align:left;padding:10px;border-radius:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item:hover,.history-item.active{background:var(--panel2);color:white}
.side-note{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line)}
.head-left{display:flex;align-items:center;gap:10px;font-weight:650}
.status{font-size:12px;color:#c4b5fd;background:#29213b;border:1px solid #43345f;border-radius:999px;padding:4px 9px}
#mobileNew{display:none;border:1px solid var(--line);background:var(--panel);color:white;border-radius:9px;padding:7px 10px}
#chat{flex:1;overflow:auto;padding:28px 18px 18px}
.conversation{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-height:100%}
.welcome{margin:auto;text-align:center;padding:30px 0 60px;max-width:580px}
.welcome-logo{width:64px;height:64px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;font-size:34px;color:#171323;background:linear-gradient(135deg,#ddd6fe,#8b5cf6)}
h1{font-size:clamp(27px,5vw,38px);letter-spacing:-1.2px;line-height:1.2;margin:0 0 12px}
.welcome p{color:var(--muted);margin:0 0 24px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}
.suggestion{background:var(--panel);border:1px solid var(--line);border-radius:13px;color:#e5e5eb;padding:13px;text-align:left}
.suggestion:hover{border-color:#6d5a91;background:#211d2b}
.message{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-weight:750;font-size:13px;background:#29232f;color:#d8b4fe}
.message.user .avatar{background:#292936;color:#e4e4ec}
.message-body{min-width:0;padding-top:3px;overflow-wrap:anywhere}
.message-label{font-size:12px;color:var(--muted);margin-bottom:5px}
.message-text{white-space:pre-wrap;overflow-wrap:anywhere}
.error{color:var(--danger)}.typing{color:var(--muted);font-size:14px}
.composer-wrap{padding:12px 18px 18px;background:linear-gradient(transparent,var(--bg) 25%)}
.composer{max-width:820px;margin:0 auto;border:1px solid #393943;background:#1a1a21;border-radius:18px;padding:10px 10px 10px 15px;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:180px;min-height:28px;border:0;outline:0;background:transparent;color:var(--text);padding:5px 0;line-height:1.5}
textarea::placeholder{color:#858592}
#send{width:38px;height:38px;border:0;border-radius:12px;background:var(--accent);color:#171323;display:grid;place-items:center;font-size:18px;font-weight:800;flex-shrink:0}
#send:disabled{opacity:.45;cursor:wait}
.fineprint{text-align:center;font-size:11px;color:#777783;padding-top:9px}
@media(max-width:700px){
.app{grid-template-columns:1fr}aside{display:none}header{padding:0 14px}#mobileNew{display:block}
#chat{padding:22px 15px 12px}.composer-wrap{padding:10px 12px 12px}
.suggestions{grid-template-columns:1fr}.welcome{padding:18px 0 38px}
.message{grid-template-columns:30px minmax(0,1fr);gap:9px}.avatar{width:29px;height:29px}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><span class="logo">✳</span><span>Astrabot</span></div>
  <button class="new-chat" id="newChat"><span>＋</span><span>Chat baru</span></button>
  <div class="history-title">Percakapan</div>
  <div id="history"></div>
  <div class="side-note">Astrabot · Asisten AI pribadi<br>Riwayat disimpan di perangkat ini.</div>
</aside>
<main>
  <header>
    <div class="head-left"><span class="logo" style="width:29px;height:29px;border-radius:10px;font-size:16px">✳</span><span>Astrabot</span><span class="status">AI Assistant</span></div>
    <button id="mobileNew">＋ Chat baru</button>
  </header>
  <section id="chat" aria-live="polite"><div class="conversation" id="conversation"></div></section>
  <div class="composer-wrap">
    <form class="composer" id="chatForm">
      <textarea id="prompt" rows="1" placeholder="Kirim pesan ke Astrabot..." aria-label="Pesan" required></textarea>
      <button id="send" type="submit" aria-label="Kirim pesan">↑</button>
    </form>
    <div class="fineprint">Periksa kembali informasi penting dari AI.</div>
  </div>
</main>
</div>
<script>
(() => {
"use strict";

const API_URL = "https://shy-butterfly-665d.kaa-ptma2128.workers.dev/chat";
const STORAGE_KEY = "astrabot_chats_v1";
const $ = id => document.getElementById(id);
const conversationEl = $("conversation");
const chatEl = $("chat");
const promptEl = $("prompt");
const sendBtn = $("send");
let chats = loadChats();
let activeId = null;
let busy = false;

function loadChats(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  }catch(_){return []}
}
function saveChats(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(chats))}catch(_){}
}
function currentChat(){return chats.find(c=>c.id===activeId)}
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function newChat(){
  if(busy)return;
  activeId=null;render();promptEl.focus();
}
function ensureChat(firstMessage){
  let chat=currentChat();
  if(!chat){
    chat={id:makeId(),title:firstMessage.slice(0,42)||"Percakapan baru",messages:[],updated:Date.now()};
    chats.unshift(chat);activeId=chat.id;
  }
  return chat;
}
function addMessage(role,text,extraClass=""){
  const row=document.createElement("div");
  row.className="message "+(role==="user"?"user":"assistant");
  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=role==="user"?"Lu":"✳";
  const body=document.createElement("div");
  body.className="message-body";
  const label=document.createElement("div");
  label.className="message-label";
  label.textContent=role==="user"?"Lu":"Astrabot";
  const content=document.createElement("div");
  content.className="message-text"+(extraClass?" "+extraClass:"");
  content.textContent=text;
  body.append(label,content);row.append(avatar,body);
  conversationEl.append(row);
  return content;
}
function renderHistory(){
  const holder=$("history");holder.replaceChildren();
  chats.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(chat=>{
    const btn=document.createElement("button");
    btn.className="history-item"+(chat.id===activeId?" active":"");
    btn.textContent=chat.title||"Percakapan baru";
    btn.title=btn.textContent;
    btn.onclick=()=>{if(!busy){activeId=chat.id;render()}};
    holder.append(btn);
  });
}
function render(){
  conversationEl.replaceChildren();
  const chat=currentChat();
  if(!chat||!chat.messages.length){
    const welcome=document.createElement("div");
    welcome.className="welcome";
    welcome.innerHTML='<div class="welcome-logo">✳</div><h1>Ada yang bisa gua bantu?</h1><p>Gua Astrabot, asisten AI pribadi lu. Tanya apa aja buat mulai.</p><div class="suggestions"><button class="suggestion">Jelasin sesuatu yang sulit dengan simpel</button><button class="suggestion">Bantu gua bikin kode</button><button class="suggestion">Kasih ide proyek keren</button><button class="suggestion">Bantu nulis atau merangkum teks</button></div>';
    welcome.querySelectorAll(".suggestion").forEach(btn=>btn.addEventListener("click",()=>{
      promptEl.value=btn.textContent;resizePrompt();promptEl.focus();
    }));
    conversationEl.append(welcome);
  }else{
    chat.messages.forEach(m=>addMessage(m.role,m.text));
  }
  renderHistory();chatEl.scrollTop=chatEl.scrollHeight;
}
function resizePrompt(){
  promptEl.style.height="auto";
  promptEl.style.height=Math.min(promptEl.scrollHeight,180)+"px";
}
async function sendMessage(text){
  if(busy||!text.trim())return;
  const clean=text.trim();
  const chat=ensureChat(clean);
  chat.messages.push({role:"user",text:clean});
  chat.updated=Date.now();
  if(chat.messages.length===1)chat.title=clean.slice(0,42);
  saveChats();render();

  busy=true;sendBtn.disabled=true;promptEl.disabled=true;
  const typing=addMessage("assistant","Astrabot lagi mikir…","typing");
  chatEl.scrollTop=chatEl.scrollHeight;
  try{
    const history=chat.messages.slice(0,-1).slice(-16).map(m=>({
      role:m.role==="assistant"?"model":"user",text:m.text
    }));
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:clean,history})
    });
    let data={};
    try{data=await response.json()}catch(_){}
    if(!response.ok)throw new Error(data.error||("Server error ("+response.status+")"));
    if(!data.reply||typeof data.reply!=="string")throw new Error("Server belum mengirim jawaban. Coba lagi.");
    chat.messages.push({role:"assistant",text:data.reply.trim()});
    chat.updated=Date.now();saveChats();render();
  }catch(err){
    let message=err&&err.message?err.message:"Koneksi gagal.";
    if(message==="Failed to fetch")message="Gagal menghubungi server. Periksa internet, URL Worker, dan CORS.";
    typing.classList.remove("typing");typing.classList.add("error");
    typing.textContent="Gagal: "+message;
  }finally{
    busy=false;sendBtn.disabled=false;promptEl.disabled=false;
    promptEl.focus();renderHistory();chatEl.scrollTop=chatEl.scrollHeight;
  }
}
$("chatForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=promptEl.value;
  if(!text.trim()||busy)return;
  promptEl.value="";resizePrompt();
  await sendMessage(text);
});
promptEl.addEventListener("input",resizePrompt);
promptEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("chatForm").requestSubmit()}
});
$("newChat").addEventListener("click",newChat);
$("mobileNew").addEventListener("click",newChat);
render();
})();
</script>
</body>
</html>
