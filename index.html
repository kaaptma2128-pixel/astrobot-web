
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#212121">
<title>Astrabot AI</title>
<style>
:root{color-scheme:dark;--bg:#212121;--panel:#171717;--line:#343434;--text:#eee;--muted:#aaa;--accent:#10a37f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:270px;background:#171717;padding:14px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.newchat{padding:12px;border:1px solid #444;border-radius:12px;background:transparent;text-align:left}
.newchat:hover, .history button:hover{background:#292929}
.brand{font-size:21px;font-weight:750;padding:12px 5px}
.brand span{color:#55d6ae}
.hist-title{font-size:12px;color:var(--muted);padding:10px 5px 0}
.history{display:flex;flex-direction:column;gap:5px;overflow:auto}
.history button{border:0;background:transparent;border-radius:9px;text-align:left;padding:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history button.active{background:#303030}
.sidebar-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:8px}
.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}
.topbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #303030}
.menu{display:none}
.topname{font-weight:650;font-size:16px}
.status{margin-left:auto;color:#a5a5a5;font-size:12px}
.messages{flex:1;overflow-y:auto;padding:26px 18px 18px}
.welcome{max-width:680px;margin:12vh auto 0;text-align:center}
.logo{width:52px;height:52px;margin:auto auto 20px;border-radius:18px;background:#292929;display:grid;place-items:center;font-size:28px;color:#73e0bb}
.welcome h1{font-size:28px;margin:0 0 10px}
.welcome p{color:var(--muted);line-height:1.6}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px;text-align:left}
.suggestions button{background:transparent;border:1px solid #414141;border-radius:13px;padding:14px;color:#ddd}
.suggestions button:hover{background:#303030}
.thread{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:24px}
.msg{display:flex;gap:12px;line-height:1.75;overflow-wrap:anywhere}
.avatar{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#333;font-size:13px;font-weight:700}
.msg.assistant .avatar{background:#145a47}
.msgbody{min-width:0;flex:1;padding-top:2px;white-space:pre-wrap}
.msgbody p{margin:0}
.composer-wrap{padding:12px 18px 16px}
.composer{max-width:760px;margin:auto;border:1px solid #484848;border-radius:24px;padding:10px 12px;background:#303030;display:flex;align-items:flex-end;gap:10px}
.composer textarea{flex:1;min-width:0;resize:none;max-height:160px;outline:none;border:0;background:transparent;color:var(--text);padding:8px 2px;line-height:1.5}
.send{width:38px;height:38px;border:0;border-radius:50%;background:#eee;color:#171717;font-size:20px;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.disclaimer{text-align:center;color:#888;font-size:11px;margin:10px auto 0;max-width:760px}
.backdrop{display:none}
@media(max-width:650px){
 .sidebar{position:fixed;z-index:5;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .2s;width:280px;box-shadow:10px 0 40px #0006}
 .sidebar.open{transform:translateX(0)}
 .backdrop.show{display:block;position:fixed;inset:0;background:#0008;z-index:4}
 .menu{display:block;background:transparent;border:1px solid #444;border-radius:9px;padding:7px 10px}
 .topbar{padding:0 12px}
 .messages{padding:20px 13px}
 .composer-wrap{padding:8px 10px 12px}
 .welcome{margin-top:10vh}
 .welcome h1{font-size:24px}
 .suggestions{grid-template-columns:1fr}
 .status{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand">✳ <span>Astrabot</span></div>
  <button class="newchat" id="newChat">＋ &nbsp; Chat baru</button>
  <div class="hist-title">Riwayat percakapan</div>
  <div class="history" id="history"></div>
  <div class="sidebar-foot">Astrabot AI · Versi awal</div>
 </aside>
 <div class="backdrop" id="backdrop"></div>
 <main class="main">
  <header class="topbar">
   <button class="menu" id="menu" aria-label="Buka menu">☰</button>
   <div class="topname">Astrabot <span style="color:#aaa;font-weight:400">AI</span></div>
   <div class="status">● Siap digunakan</div>
  </header>
  <section class="messages" id="messages">
   <div class="welcome" id="welcome">
    <div class="logo">✳</div>
    <h1>Ada yang bisa kubantu?</h1>
    <p>Astrabot adalah asisten AI pribadi lu.<br>Mulai percakapan dengan menulis pesan di bawah.</p>
    <div class="suggestions">
     <button data-prompt="Bantu aku belajar coding dari awal">💻 &nbsp; Belajar coding</button>
     <button data-prompt="Bantu aku mencari ide proyek yang menarik">💡 &nbsp; Cari ide proyek</button>
     <button data-prompt="Jelaskan teknologi AI dengan bahasa sederhana">🧠 &nbsp; Mengenal AI</button>
     <button data-prompt="Bantu aku menulis rencana belajar mingguan">📝 &nbsp; Buat rencana</button>
    </div>
   </div>
   <div class="thread" id="thread"></div>
  </section>
  <footer class="composer-wrap">
   <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Tanya apa saja ke Astrabot..." aria-label="Pesan"></textarea>
    <button class="send" id="send" aria-label="Kirim pesan">↑</button>
   </form>
   <div class="disclaimer" id="notice">Hubungan ke layanan AI belum diatur. Jawaban AI akan aktif setelah backend disambungkan.</div>
  </footer>
 </main>
</div>
<script>
/* Isi URL backend setelah backend AI selesai dibuat. */
const API_URL = "https://shy-butterfly-665d.kaa-ptma2128.workers.dev/chat";

const $ = id => document.getElementById(id);
let chats = [];
let currentId = null;
let busy = false;

try {
  chats = JSON.parse(localStorage.getItem("astrabot_chats") || "[]");
  if (!Array.isArray(chats)) chats = [];
} catch { chats = []; }

function save() {
  try { localStorage.setItem("astrabot_chats", JSON.stringify(chats)); }
  catch { $("notice").textContent = "Penyimpanan lokal penuh. Riwayat mungkin tidak tersimpan."; }
}
function currentChat() { return chats.find(c => c.id === currentId); }

function newChat() {
  currentId = null;
  $("thread").replaceChildren();
  $("welcome").hidden = false;
  $("input").value = "";
  $("input").focus();
  renderHistory();
  closeMenu();
}

function renderHistory() {
  const box = $("history");
  box.replaceChildren();
  [...chats].reverse().forEach(chat => {
    const b = document.createElement("button");
    b.textContent = chat.title || "Percakapan baru";
    b.className = chat.id === currentId ? "active" : "";
    b.onclick = () => openChat(chat.id);
    box.appendChild(b);
  });
}
function openChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  currentId = id;
  $("welcome").hidden = true;
  $("thread").replaceChildren();
  chat.messages.forEach(m => addMessage(m.role, m.text));
  renderHistory();
  closeMenu();
}
function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "Lu" : "✳";
  const body = document.createElement("div");
  body.className = "msgbody";
  body.textContent = text;
  row.append(avatar, body);
  $("thread").appendChild(row);
  $("messages").scrollTop = $("messages").scrollHeight;
}
function resizeInput() {
  const el = $("input");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}
async function sendMessage(text) {
  text = text.trim();
  if (!text || busy) return;
  if (!currentId) {
    currentId = String(Date.now());
    chats.push({id:currentId,title:text.slice(0,36),messages:[]});
  }
  const chat = currentChat();
  chat.messages.push({role:"user",text});
  $("welcome").hidden = true;
  addMessage("user", text);
  $("input").value = "";
  resizeInput();
  busy = true;
  $("send").disabled = true;

  const wait = document.createElement("div");
  wait.className = "msg assistant";
  wait.innerHTML = '<div class="avatar">✳</div><div class="msgbody">Sedang berpikir...</div>';
  $("thread").appendChild(wait);
  $("messages").scrollTop = $("messages").scrollHeight;

  try {
    if (!API_URL) throw new Error("BACKEND_NOT_CONFIGURED");
    const history = chat.messages.slice(0,-1).map(m => ({
      role:m.role === "assistant" ? "model" : "user", text:m.text
    }));
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,history})
    });
    if (!response.ok) throw new Error("Layanan AI error ("+response.status+").");
    const data = await response.json();
    if (!data.reply) throw new Error("Jawaban AI kosong.");
    wait.remove();
    chat.messages.push({role:"assistant",text:data.reply});
    addMessage("assistant",data.reply);
  } catch (err) {
    wait.remove();
    const message = err.message === "BACKEND_NOT_CONFIGURED"
      ? "Website sudah siap, tetapi otak AI belum disambungkan. Kita lanjutkan pengaturan backend agar Astrabot bisa menjawab pesan."
      : "Belum berhasil terhubung ke AI. Periksa koneksi dan pengaturan backend, lalu coba lagi.";
    addMessage("assistant",message);
  } finally {
    busy = false;
    $("send").disabled = false;
    save();
    renderHistory();
  }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  sendMessage($("input").value);
});
$("input").addEventListener("input",resizeInput);
$("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit();}
});
$("newChat").onclick = newChat;
$("menu").onclick = () => {
  $("sidebar").classList.add("open");
  $("backdrop").classList.add("show");
};
function closeMenu() {
  $("sidebar").classList.remove("open");
  $("backdrop").classList.remove("show");
}
$("backdrop").onclick = closeMenu;
document.querySelectorAll("[data-prompt]").forEach(b=>{
  b.onclick=()=>sendMessage(b.dataset.prompt);
});
renderHistory();
</script>
</body>
</html>
